services:
  rabbit:
    image: "rabbitmq:3.12-management"
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]  # ← MEJOR formato
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service
  configserver:
    image: "gallardofabian/configserver:v1"
    container_name: configserver
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8071/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  accounts:
    image: "gallardofabian/accounts:v1"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8071
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8071
      - SPRING_APPLICATION_NAME=accounts
      - SPRING_PROFILES_ACTIVE=prod


  loans:
    image: "gallardofabian/loans:v1"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - BPL_JVM_THREAD_COUNT=50
      - JAVA_TOOL_OPTIONS=-XX:ReservedCodeCacheSize=64M -XX:MaxMetaspaceSize=100M
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8071
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8071
      - SPRING_APPLICATION_NAME=loans
      - SPRING_PROFILES_ACTIVE=prod
    extends:
      file: common-config.yml
      service: microservice-base-config

  cards:
    image: "gallardofabian/cards:v1"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8071
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8071
      - SPRING_APPLICATION_NAME=cards
      - SPRING_PROFILES_ACTIVE=prod

networks:
  banknetwork:
    driver: bridge