spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  #rabbitmq:
  #  host: ${SPRING_RABBITMQ_HOST:localhost}
  #  port: ${SPRING_RABBITMQ_PORT:5672}
  #  username: guest
  #  password: guest
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}
  application:
    name: cards
  main:
    allow-bean-definition-overriding: true
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}
      fail-fast: true

  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
server:
  port: 9000
management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  cache:
    disabled: true
  swagger-ui:
    cache:
      disabled: true
    try-it-out-enabled: true
    disable-swagger-default-url: true
    url: /v3/api-docs
    config-url: /v3/api-docs/swagger-config
    refresh-interval: 0

app:
  infra:
    openapi:
      title: Cards Microservice API
      description: Microservicio de Tarjetas - API para la gestion de tarjetas de credito y debito
      version: 1.0.0
      contact:
        name: Cards Support Team
        email: cards.support@nacionservicios.com.ar
        url: https://nacionservicios.com.ar/cards
      security:
        enabled: true
