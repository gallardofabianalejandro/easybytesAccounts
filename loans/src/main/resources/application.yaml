spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: guest
    password: guest
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}
  application:
    name: loans
  main:
    allow-bean-definition-overriding: true
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}
      fail-fast: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
server:
  port: 8090

# Metadatos para OpenAPI (usando el starter)
app:
  infra:
    openapi:
      title: Loans Microservice API
      description: Microservicio de Prestamos - API para la gestion completa de prestamos personales, hipotecarios, vehiculares y comerciales
      version: 1.0.0
      contact:
        name: Loans Support Team
        email: loans.support@nacionservicios.com.ar
        url: https://nacionservicios.com.ar/loans
      security:
        enabled: true
        api-key:
          enabled: true
          header-name: X-API-Key
          type: apiKey

# Configuracion de la interfaz de SpringDoc
springdoc:
  cache:
    disabled: true
  swagger-ui:
    cache:
      disabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  exception:
    include-stack-trace: false
    include-cause: true
    log-level: ERROR
    sensitive-fields:
      - password
      - ssn
      - creditCard
      - accountNumber
      - routingNumber
      - cvv
      - pin
      - email
    expose-error-codes: true
    base-error-uri: https://api.nacionservicios.com.ar/errors
management:
  endpoints:
    web:
      exposure:
        include: "*"
