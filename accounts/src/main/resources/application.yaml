spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: guest
    password: guest
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}
      fail-fast: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    allow-bean-definition-overriding: true
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  # *** PROPIEDAD CLAVE PARA FORZAR LA EJECUCIÓN DEL SCRIPT ***
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    #org.hibernate.SQL: DEBUG
   # org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.openapi.autoconfigure: DEBUG
    com.nacionservicios.accounts.config: DEBUG
    org.springframework.cloud.context: DEBUG
    org.springframework.cloud.config.client: DEBUG
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "*"

# Allow bean definition overriding to resolve conflicts

# SpringDoc OpenAPI configuration - Standard endpoint with cache disabled
springdoc:
  cache:
    disabled: true
  swagger-ui:
    cache:
      disabled: true
    try-it-out-enabled: true
    disable-swagger-default-url: true
    url: /v3/api-docs
    config-url: /v3/api-docs/swagger-config
    refresh-interval: 0
